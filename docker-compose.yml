services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: library_backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - library_data:/app/data
      - library_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - library_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: library_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - library_network

volumes:
  library_data:
    name: library_management_data
  library_uploads:
    name: library_management_uploads

networks:
  library_network:
    name: library_management_network
    driver: bridge
